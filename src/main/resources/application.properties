spring.application.name=SmartHR
server.port=8082

#Data source configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/smarthr_db
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Every lazy association is either @JsonIgnore'd or loaded inside a service transaction
spring.jpa.open-in-view=false

# First-start sample data (Rwanda provinces/districts/Kigali sectors + departments).
# Only runs while the location / department tables are empty.
smarthr.seed.enabled=true

# --- security ---------------------------------------------------------------------------------
# Secret that signs the login tokens (at least 32 characters). The default below is for local
# development ONLY: set SMARTHR_JWT_SECRET anywhere else, otherwise anyone who reads this file can
# forge a login.
smarthr.security.jwt-secret=${SMARTHR_JWT_SECRET:dev-only-secret-please-change-0123456789abcdef}
# How long a login lasts
smarthr.security.token-ttl=25m
# After this many wrong passwords in a row the account is locked for the duration below
smarthr.security.max-failed-logins=5
smarthr.security.lockout-duration=10m
# The first administrator, created on the very first start (when there are no accounts yet).
# If no password is given, a random one is generated and printed once in the log.
smarthr.security.bootstrap-admin.username=${SMARTHR_ADMIN_USERNAME:admin@smarthr.local}
smarthr.security.bootstrap-admin.password=${SMARTHR_ADMIN_PASSWORD:}

# --- leave balance ----------------------------------------------------------------------------
# Working days (Monday to Friday) of each kind of leave one employee gets per calendar year. Pending
# requests already count against it, and a request that asks for more than is left is refused.
# Unpaid leave has no limit. These are starting values: set the ones your organisation uses.
smarthr.leave.annual-days=18
smarthr.leave.sick-days=15

# --- email ------------------------------------------------------------------------------------
# Emails go out through the SMTP server below. While spring.mail.host is empty nothing is sent: each email is
# only written to the log, so the app works the same on a development machine.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# The sender, the address of the web app (used for the buttons in the emails), and a master switch.
smarthr.mail.from=${SMTP_FROM:SmartHR <no-reply@smarthr.local>}
smarthr.mail.app-url=${SMARTHR_APP_URL:http://localhost:5173}
smarthr.mail.enabled=true
# Trainings that start this many days from now are announced to the people enrolled, every morning at 07:00.
smarthr.mail.reminder-days-before=1

# --- RabbitMQ ---------------------------------------------------------------------------------
# Emails are put on a queue and sent by a consumer, so they survive a restart and are retried when the mail server
# is down. Start the broker with:  docker compose up -d   (the management console is then at http://localhost:15672)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# A failed send is tried again 4 times (5 attempts in all), 5 s, 15 s, 45 s and 2 min apart; after that the email goes to
# the dead-letter queue. (max-retries counts the tries after the first one.)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=4
spring.rabbitmq.listener.simple.retry.initial-interval=5s
spring.rabbitmq.listener.simple.retry.multiplier=3
spring.rabbitmq.listener.simple.retry.max-interval=2m
# a message that is rejected must not go back on the queue, it must go to the dead-letter queue
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Sign in with Google (OAuth2 / OpenID Connect) ---------------------------------------------
# Create an OAuth client ("Web application") in the Google Cloud console, add the redirect URI
#   http://localhost:8082/login/oauth2/code/google
# and give its id and secret here (use the environment variables, never commit the secret).
# While they are empty the "Continue with Google" button is not shown. A Google sign-in only works for a
# person who already has a SmartHR account whose username is their (verified) Google email address.
smarthr.google.client-id=${GOOGLE_CLIENT_ID:}
smarthr.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# where the browser is sent back to after Google (the address of the web app)
smarthr.google.frontend-url=${SMARTHR_APP_URL:http://localhost:5173}
